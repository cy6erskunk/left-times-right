# This workflow will do a clean install of node dependencies, then check, test and build the source code across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macOS-latest

    strategy:
      matrix:
        # Vite+ requires Node ^22.18.0 || ^24.11.0 || >=26.0.0
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Format, lint and type check in one pass
      - run: npx vp check
      - run: npx vp test
      - run: npx vp build
